<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 412" width="900" height="412" role="img"><style></style><defs><pattern id="f" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M8 0H0V8" fill="none" stroke="#ECE7DA"/></pattern><pattern id="b" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#DCD5C4"/></pattern></defs><rect width="900" height="412" rx="4" fill="#FBFAF6"/><rect width="900" height="412" rx="4" fill="url(#f)"/><rect width="900" height="412" rx="4" fill="url(#b)"/><rect x="0.5" y="0.5" width="899" height="411" rx="4" fill="none" stroke="#D9D2C2"/><rect x="24" y="24" width="418" height="364" fill="#fff" stroke="#21201C" rx="3"/><text x="40" y="57" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#21201C">Production VM · admin locked out of RDP</text><rect x="40" y="67" width="60" height="16" fill="none" stroke="#B5402C" rx="2"/><text x="46" y="78" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="400" fill="#B5402C" letter-spacing="1">SYMPTOM</text><text x="114" y="78" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">Client could not connect over RDP for a</text><text x="114" y="97" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">day. 18,353 failed logons in 24 hours from</text><text x="114" y="116" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">dozens of IPs; the local admin account</text><text x="114" y="135" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">locked every 10 minutes.</text><rect x="40" y="151" width="60" height="16" fill="none" stroke="#B5402C" rx="2"/><text x="46" y="162" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="400" fill="#B5402C" letter-spacing="1">CAUSE</text><text x="114" y="162" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">Port 3389 open to the internet times a</text><text x="114" y="181" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">10-attempt lockout policy. Not an Azure</text><text x="114" y="200" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">block: VM healthy, no control-plane</text><text x="114" y="219" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">changes.</text><rect x="40" y="235" width="60" height="16" fill="none" stroke="#2E6B4A" rx="2"/><text x="46" y="246" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="400" fill="#2E6B4A" letter-spacing="1">FIX</text><text x="114" y="246" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">Read-only diagnosis from the guest event</text><text x="114" y="265" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">log, then an NSG allowlist the same day.</text><text x="114" y="284" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">Zero-trust tunnel access later.</text><rect x="36" y="304" width="394" height="71" fill="#F3EFE4"/><rect x="36" y="304" width="3" height="71" fill="#B07C1E"/><text x="48" y="319" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="400" fill="#B07C1E" letter-spacing="1.2">LESSON</text><text x="114" y="319" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">Brute force does not need to win to lock you</text><text x="114" y="338" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">out. Close the port first; hardening the</text><text x="114" y="357" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">password comes second.</text><rect x="458" y="24" width="418" height="307" fill="#fff" stroke="#21201C" rx="3"/><text x="474" y="57" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#21201C">Nim #26785 · seq growth under refc</text><rect x="474" y="67" width="60" height="16" fill="none" stroke="#B5402C" rx="2"/><text x="480" y="78" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="400" fill="#B5402C" letter-spacing="1">SYMPTOM</text><text x="548" y="78" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">A repro that appended 1,005 elements ended</text><text x="548" y="97" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">with one.</text><rect x="474" y="113" width="60" height="16" fill="none" stroke="#B5402C" rx="2"/><text x="480" y="124" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="400" fill="#B5402C" letter-spacing="1">CAUSE</text><text x="548" y="124" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">Growing a seq can run a GC cycle; its</text><text x="548" y="143" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">finalizers mutated the object while growth</text><text x="548" y="162" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">kept the payload pointer taken before the</text><text x="548" y="181" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">allocation.</text><rect x="474" y="197" width="60" height="16" fill="none" stroke="#2E6B4A" rx="2"/><text x="480" y="208" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="400" fill="#2E6B4A" letter-spacing="1">FIX</text><text x="548" y="208" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">Payload-replacement allocations now run</text><text x="548" y="227" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">with the GC disabled. Merged 24 Nov 2026.</text><rect x="470" y="247" width="394" height="71" fill="#F3EFE4"/><rect x="470" y="247" width="3" height="71" fill="#B07C1E"/><text x="482" y="262" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="400" fill="#B07C1E" letter-spacing="1.2">LESSON</text><text x="548" y="262" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">If a growth path can trigger finalizers, the</text><text x="548" y="281" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">old payload pointer is stale the moment you</text><text x="548" y="300" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">allocate.</text></svg>