<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Santhi Prakash — AI systems builder and open-source contributor</title>
  <desc id="desc">A dark blue technical landscape connecting production systems, cloud architecture, and open source.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1f35"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55d6be"/>
      <stop offset="1" stop-color="#72a7ff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#55d6be" stop-opacity=".24"/>
      <stop offset="1" stop-color="#55d6be" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#background)"/>
  <circle cx="1060" cy="40" r="180" fill="url(#glow)" filter="url(#soft)"/>
  <circle cx="170" cy="295" r="150" fill="#3867d6" opacity=".10" filter="url(#soft)"/>

  <g fill="none" stroke="#72a7ff" stroke-opacity=".18">
    <path d="M790 57h87l36 44h88l46 53h87"/>
    <path d="M768 228h76l46-45h92l37-42h117"/>
    <path d="M860 20v56M982 101v82M890 183v72M1047 154v91"/>
  </g>
  <g fill="#55d6be">
    <circle cx="790" cy="57" r="5"/><circle cx="913" cy="101" r="5"/>
    <circle cx="1001" cy="101" r="5"/><circle cx="1047" cy="154" r="5"/>
    <circle cx="844" cy="228" r="5"/><circle cx="890" cy="183" r="5"/>
    <circle cx="982" cy="183" r="5"/>
  </g>

  <rect x="72" y="62" width="54" height="7" rx="3.5" fill="url(#accent)"/>
  <text x="72" y="127" fill="#f3f7fb" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="54" font-weight="700" letter-spacing="-1.5">Santhi Prakash</text>
  <text x="74" y="173" fill="#b8c7d9" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="23">AI systems · cloud architecture · open source</text>
  <text x="74" y="224" fill="#55d6be" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">observe → reproduce → isolate → test → contribute → maintain</text>

  <rect x="72" y="256" width="1056" height="1" fill="#d9e7f5" opacity=".12"/>
</svg>
