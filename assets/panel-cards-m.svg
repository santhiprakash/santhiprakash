<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 823" width="400" height="823" role="img"><style></style><defs><pattern id="f" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M8 0H0V8" fill="none" stroke="#ECE7DA"/></pattern><pattern id="b" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#DCD5C4"/></pattern></defs><rect width="400" height="823" rx="4" fill="#FBFAF6"/><rect width="400" height="823" rx="4" fill="url(#f)"/><rect width="400" height="823" rx="4" fill="url(#b)"/><rect x="0.5" y="0.5" width="399" height="822" rx="4" fill="none" stroke="#D9D2C2"/><rect x="20" y="20" width="360" height="424" fill="#fff" stroke="#21201C" rx="3"/><text x="36" y="53" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#21201C">Production VM · admin locked out of</text><text x="36" y="75" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#21201C">RDP</text><rect x="36" y="85" width="60" height="16" fill="none" stroke="#B5402C" rx="2"/><text x="42" y="96" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="400" fill="#B5402C" letter-spacing="1">SYMPTOM</text><text x="110" y="96" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">Client could not connect over RDP</text><text x="110" y="115" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">for a day. 18,353 failed logons in</text><text x="110" y="134" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">24 hours from dozens of IPs; the</text><text x="110" y="153" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">local admin account locked every</text><text x="110" y="172" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">10 minutes.</text><rect x="36" y="188" width="60" height="16" fill="none" stroke="#B5402C" rx="2"/><text x="42" y="199" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="400" fill="#B5402C" letter-spacing="1">CAUSE</text><text x="110" y="199" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">Port 3389 open to the internet</text><text x="110" y="218" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">times a 10-attempt lockout policy.</text><text x="110" y="237" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">Not an Azure block: VM healthy, no</text><text x="110" y="256" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">control-plane changes.</text><rect x="36" y="272" width="60" height="16" fill="none" stroke="#2E6B4A" rx="2"/><text x="42" y="283" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="400" fill="#2E6B4A" letter-spacing="1">FIX</text><text x="110" y="283" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">Read-only diagnosis from the guest</text><text x="110" y="302" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">event log, then an NSG allowlist</text><text x="110" y="321" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">the same day. Zero-trust tunnel</text><text x="110" y="340" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">access later.</text><rect x="32" y="360" width="336" height="71" fill="#F3EFE4"/><rect x="32" y="360" width="3" height="71" fill="#B07C1E"/><text x="44" y="375" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="400" fill="#B07C1E" letter-spacing="1.2">LESSON</text><text x="110" y="375" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">Brute force does not need to win to</text><text x="110" y="394" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">lock you out. Close the port first;</text><text x="110" y="413" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">hardening the password comes second.</text><rect x="20" y="458" width="360" height="345" fill="#fff" stroke="#21201C" rx="3"/><text x="36" y="491" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#21201C">Nim #26785 · seq growth under refc</text><rect x="36" y="501" width="60" height="16" fill="none" stroke="#B5402C" rx="2"/><text x="42" y="512" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="400" fill="#B5402C" letter-spacing="1">SYMPTOM</text><text x="110" y="512" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">A repro that appended 1,005</text><text x="110" y="531" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">elements ended with one.</text><rect x="36" y="547" width="60" height="16" fill="none" stroke="#B5402C" rx="2"/><text x="42" y="558" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="400" fill="#B5402C" letter-spacing="1">CAUSE</text><text x="110" y="558" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">Growing a seq can run a GC cycle;</text><text x="110" y="577" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">its finalizers mutated the object</text><text x="110" y="596" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">while growth kept the payload</text><text x="110" y="615" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">pointer taken before the</text><text x="110" y="634" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">allocation.</text><rect x="36" y="650" width="60" height="16" fill="none" stroke="#2E6B4A" rx="2"/><text x="42" y="661" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="400" fill="#2E6B4A" letter-spacing="1">FIX</text><text x="110" y="661" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">Payload-replacement allocations</text><text x="110" y="680" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">now run with the GC disabled.</text><text x="110" y="699" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">Merged 24 Nov 2026.</text><rect x="32" y="719" width="336" height="71" fill="#F3EFE4"/><rect x="32" y="719" width="3" height="71" fill="#B07C1E"/><text x="44" y="734" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="400" fill="#B07C1E" letter-spacing="1.2">LESSON</text><text x="110" y="734" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">If a growth path can trigger</text><text x="110" y="753" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">finalizers, the old payload pointer</text><text x="110" y="772" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#21201C">is stale the moment you allocate.</text></svg>